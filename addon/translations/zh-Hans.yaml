---
configuration:
  access_mode:
    name: 画面访问范围
    description: >-
      谁可以访问本加载项。选 “local” 时一切都留在本机 —— Home Assistant
      与它同机所以能读取画面，局域网上的其他设备访问不到，也不需要任何密码。选 “lan” 会把画面和本加载项的页面一起发布到整个局域网，供 Frigate
      等软件拉取；此时 RTSP 用户名、RTSP 密码和网页密码全部变为必填，缺任何一项加载项都不会启动。
  rtsp_username:
    name: RTSP 用户名
    description: >-
      画面访问范围为 “lan” 时必填。局域网中任何知道用户名和密码的人，都能看到你的摄像头画面。
  rtsp_password:
    name: RTSP 密码
    description: >-
      画面访问范围为 “lan” 时必填。一个没有密码保护、端口又众所周知的摄像头画面，几秒钟就会被局域网扫描发现。
  web_password:
    name: 网页密码
    description: >-
      保护本加载项的页面 —— 那个页面能看到你的摄像头画面，也能解绑你的小米账号。画面访问范围为 “lan”
      时必填，因为那会把页面放到局域网上。其他情况下可以不填；但只要你设置了，任何部署方式下都会强制校验，通过 Home Assistant 面板进入时也一样。
  log_level:
    name: 日志级别
    description: >-
      本加载项写入日志的详细程度。日常使用保持 “info” 即可；反馈问题前调到 “debug”，这也会让 go2rtc 一并输出它的运行情况。“trace”
      更详细，而 “warning”“error”“fatal” 依次更安静。
