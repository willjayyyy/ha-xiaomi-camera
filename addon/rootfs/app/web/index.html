<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xiaomi Camera Bridge</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<section id="signin" hidden>
  <span class="lang">
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="zh">中文</button>
  </span>
  <form class="signin-card" id="signin-form">
    <div class="signin-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4Z"/></svg>
    </div>
    <h1 data-i18n="signInTitle">Xiaomi Camera Bridge</h1>
    <p class="sub" data-i18n="signInHint">Enter the web page password from this add-on's configuration.</p>
    <input id="signin-password" type="password" autocomplete="current-password"
           required data-i18n-placeholder="signInPlaceholder">
    <p class="signin-error" id="signin-error" hidden></p>
    <button class="primary" type="submit" data-i18n="signIn">Sign in</button>
  </form>
</section>

<main hidden>
  <header>
    <div>
      <h1 data-i18n="title">Xiaomi Camera Bridge</h1>
      <p class="sub" data-i18n="subtitle">Publishes your Xiaomi cameras as standard RTSP streams.</p>
    </div>
    <span class="head-actions">
      <span class="lang">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="zh">中文</button>
      </span>
      <button type="button" id="account-btn" class="icon-btn" data-i18n-label="accountTitle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </button>
      <button type="button" id="settings-btn" class="icon-btn" data-i18n-label="settingsTitle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.4 7.4 0 0 0 0-2l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.4.96a7.5 7.5 0 0 0-1.73-1l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.5 7.5 0 0 0-1.73 1l-2.4-.96a.5.5 0 0 0-.6.22L2.4 8.78a.5.5 0 0 0 .12.64L4.55 11a7.4 7.4 0 0 0 0 2L2.52 14.6a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.4-.96a7.5 7.5 0 0 0 1.73 1l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7.5 7.5 0 0 0 1.73-1l2.4.96c.22.09.48 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </span>
  </header>

  <div id="message" class="msg"></div>

  <section>
    <div class="section-head"><h2 data-i18n="camerasHeading">Cameras</h2></div>
    <div id="cameras"><p class="empty" data-i18n="notLoaded">Not loaded yet.</p></div>
  </section>
</main>

<!-- One overlay primitive, two contents (the settings sheet and the enlarged
     preview) -- see the CSS comment above `#overlay` for why this is built
     once rather than per use. -->
<div id="overlay" hidden>
  <button type="button" class="overlay-backdrop" id="overlay-backdrop" tabindex="-1" aria-hidden="true"></button>
  <div class="overlay-panel" id="overlay-panel" role="dialog" aria-modal="true" tabindex="-1">
    <div class="overlay-head">
      <span class="overlay-title" id="overlay-title"></span>
      <button type="button" class="overlay-close" id="overlay-close" data-i18n-label="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
      </button>
    </div>
    <div class="overlay-body" id="overlay-body"></div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
