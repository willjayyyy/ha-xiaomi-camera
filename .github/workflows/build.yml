name: Build add-on

on:
  push:
    branches: [main, "release/*"]
    paths:
      - "addon/**"
      - "custom_components/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  # Produces ghcr.io/<owner>/<arch>-addon-xiaomi-camera-bridge per architecture,
  # which is the form addon/config.yaml points at through its {arch} placeholder.
  IMAGE_NAME: addon-xiaomi-camera-bridge

permissions:
  contents: read

concurrency:
  group: build-addon
  cancel-in-progress: false

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version="$(yq -r '.version' addon/config.yaml)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not read version from addon/config.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Cosign signing needs an OIDC token
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          context: ./addon
          # These actions build any container image and do not read an add-on's
          # build.yaml, so the per-architecture base image is passed explicitly.
          # It must stay Debian: the vendor's streaming library is glibc-only and
          # cannot load on the Alpine images most add-ons use.
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm
          push: "true"
          version: ${{ needs.init.outputs.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  # HACS learns about versions from GitHub releases and from nothing else:
  # without one it installs from the default branch, offers no version to
  # choose and never reports an update.
  #
  # Every build -- on a release/* branch or on main -- moves the version tag to
  # the commit just built and keeps the matching release flagged pre-release.
  # The pre-release is the validation phase: users install it with HACS "Show
  # beta versions". Promoting it to the official release is deliberately manual
  # -- the maintainer reviews the hardware-validated result and clicks "Publish
  # release", which flips the same release to Latest. A release that has already
  # been promoted is left alone, so the official version is never rewritten by
  # a later build of the same tag.
  release:
    name: Refresh pre-release
    needs: [init, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the tag and refresh the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          # The changelog entry for this version, verbatim. It is written for
          # the person deciding whether to update, which is exactly who reads a
          # release, so there is no second set of notes to keep in step.
          awk -v version="## ${VERSION}" '
            $0 == version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' addon/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::addon/CHANGELOG.md has no entry for ${VERSION}"
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            # Leave an already-official release alone; only pre-releases are
            # refreshed as the branch moves.
            if [ "$(gh release view "${tag}" --json isPrerelease -q .isPrerelease)" = "false" ]; then
              echo "${tag} is already the official release; leaving it unchanged"
              exit 0
            fi
          fi

          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag -f "${tag}"
          git push -f origin "${tag}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --prerelease --notes-file notes.md
          else
            gh release create "${tag}" --title "v${VERSION}" --notes-file notes.md --prerelease
          fi
