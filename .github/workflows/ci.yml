name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
  workflow_dispatch:

jobs:
  # The add-on ships a pre-built web UI (`addon/rootfs/app/web`); a change to
  # the Svelte source that forgets to rebuild would sail into the image with
  # CI green (the image build only compares versions, never hashes source).
  # Building here and diffing the committed output makes that a failure
  # instead.
  web-build:
    name: Web build is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install and build
        run: |
          cd addon/web
          npm ci
          npm run build
      - name: Committed output must match the fresh build
        run: git diff --exit-code addon/rootfs/app/web

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Tests the integration against the pinned Home Assistant release this
      # add-on is deployed against (see requirements-test.txt). The vendor
      # SDK stays stubbed in tests/conftest.py -- it is closed source and
      # glibc-only, so it cannot be installed here or anywhere in CI.
      - run: pip install -r requirements-test.txt
      - run: python -m pytest

  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets live in the home-assistant/brands repository and are
          # added by a separate pull request there. Everything else HACS checks
          # is enforced here.
          ignore: brands
