[pytest]
testpaths = tests
addopts = -q
pythonpath = .
# The guard tests drive a real aiohttp server; without this every one of
# them is silently skipped rather than reported as unrun.
asyncio_mode = auto
# Home Assistant sets `app["hass"]` for backwards compatibility, which the
# aiohttp version it pins warns about. Both are pinned by
# requirements-test.txt, nothing here can fix it, and as an error it stops the
# camera platform from setting up at all. Scoped to this one warning class so
# every other warning still fails the suite. Remove when Home Assistant drops
# that line.
filterwarnings =
    error
    ignore::aiohttp.web_exceptions.NotAppKeyWarning
